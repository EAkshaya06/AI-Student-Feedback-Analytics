<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff sign in | AI Feedback Analytics</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a class="logo" href="/" aria-label="AI Feedback Analytics home"><span class="logo-mark" aria-hidden="true">✳</span>AI Feedback Analytics</a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="/">Home</a><a href="/feedback">Submit Feedback</a>
      </nav>
    </div>
  </header>
  <main class="login-shell">
    <section class="dashboard-card login-card">
      <span class="eyebrow">STAFF ACCESS</span>
      <h1>Sign in to analytics</h1>
      <p>Administrator and faculty accounts can view authorized feedback summaries.</p>
      <form id="loginForm" class="feedback-fields">
        <label for="loginEmail">Work email</label>
        <input id="loginEmail" name="email" type="email" autocomplete="username" maxlength="254" required>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        <button id="loginButton" class="primary-btn" type="submit">Sign in</button>
      </form>
      <div id="loginMessage" class="form-message" role="status" aria-live="polite"></div>
      <p class="login-footnote">Student feedback stays anonymous. Staff access is provisioned by the project administrator.</p>
    </section>
  </main>
  <script src="./js/api.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
